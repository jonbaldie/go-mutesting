name: Mutation Testing

on:
  push:
    branches: [master]
    paths:
      - "**/*.go"
      - "**/testdata/**"
      - go.mod
      - go.sum
      - .github/workflows/mutation.yml
      - scripts/check-change.sh
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --git-diff-lines needs the base branch and merge-base history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build go-mutesting
        run: go build -o /usr/local/bin/go-mutesting ./cmd/go-mutesting

      - name: Run mutation testing
        # PRs use changed lines. Master keeps the full-tree gate.
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_MUTESTING_BIN: /usr/local/bin/go-mutesting
          GO_MUTESTING_WORKERS: "0"
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./scripts/check-change.sh
          else
            ./scripts/check-change.sh --full
          fi
