name: Mutation Testing

on:
  push:
    branches: [master, feature/parity]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Vulnerability scan (advisory)
        # Advisory-only until go1.26.3 is released (fixes GO-2026-4980/4982).
        # Exit code is ignored so CI is not blocked by known unfixable CVEs.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: Build go-mutesting
        run: go build -o /usr/local/bin/go-mutesting ./cmd/go-mutesting

      - name: Run mutation testing
        # Scoped to packages with isolated unit tests.
        # Excluded:
        #   cmd/               - integration tests re-invoke the binary (would recurse)
        #   internal/importing  - package-based resolution requires GOPATH mode
        #   internal/parser     - uses deprecated go/loader; excluded until migration
        # --coverage generates a profile before mutation to compute covered-code MSI
        # and marks mutants in untested code as "not covered" rather than running them.
        # --min-msi and --min-covered-msi enforce quality gates.
        run: |
          go-mutesting \
            --exec-timeout 30 \
            --coverage \
            --min-msi 75 \
            --min-covered-msi 80 \
            github.com/jonbaldie/go-mutesting/v2/mutator/arithmetic \
            github.com/jonbaldie/go-mutesting/v2/mutator/branch \
            github.com/jonbaldie/go-mutesting/v2/mutator/concurrency \
            github.com/jonbaldie/go-mutesting/v2/mutator/conditional \
            github.com/jonbaldie/go-mutesting/v2/mutator/expression \
            github.com/jonbaldie/go-mutesting/v2/mutator/loop \
            github.com/jonbaldie/go-mutesting/v2/mutator/numbers \
            github.com/jonbaldie/go-mutesting/v2/mutator/select \
            github.com/jonbaldie/go-mutesting/v2/mutator/statement \
            github.com/jonbaldie/go-mutesting/v2/internal/filter \
            github.com/jonbaldie/go-mutesting/v2/internal/coverage \
            github.com/jonbaldie/go-mutesting/v2/internal/gitdiff \
            github.com/jonbaldie/go-mutesting/v2/internal/models
